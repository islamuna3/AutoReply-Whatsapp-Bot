<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AutoReply WhatsApp Bridge 设置</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; color: #17212b; }
    label { display: block; font-weight: 650; margin: 20px 0 8px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; }
    button { margin-top: 18px; padding: 10px 18px; background: #0b7a5a; color: white; border: 0; border-radius: 6px; }
    #status { margin-left: 12px; color: #0b7a5a; }
  </style>
</head>
<body>
  <h1>AutoReply WhatsApp Bridge</h1>
  <p>端口必须与桌面 App“扩展服务端口”一致。</p>
  <label for="port">本地服务端口</label>
  <input id="port" type="number" min="1024" max="65535" value="8765">
  <button id="save">保存</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
