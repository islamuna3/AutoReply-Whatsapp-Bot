name: Build Windows EXE

on:
  push:
    branches: [codex/windows-exe-build]
    paths-ignore:
      - "dist/windows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        shell: pwsh
        run: .\build_windows.ps1
      - name: Smoke check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\windows\AutoReply-Whatsapp-Bot.exe")) { exit 1 }
          $size = (Get-Item "dist\windows\AutoReply-Whatsapp-Bot.exe").Length
          if ($size -lt 1000000) { throw "Executable is unexpectedly small: $size" }
      - name: Commit executable to build branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "dist/windows/AutoReply-Whatsapp-Bot.exe" "dist/windows/Chrome-Extension.zip"
          git commit -m "build: add Windows executable [skip ci]"
          git push
